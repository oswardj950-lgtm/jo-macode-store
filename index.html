<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JO Macode Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: white;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top, #3a2b00 0%, #080808 45%);
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #d4af37;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 35px;
    }

    .welcome {
      max-width: 600px;
      font-size: 18px;
      line-height: 1.7;
      color: #bbb;
      margin-bottom: 30px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
    }

    .category {
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: bold;
    }

    .whatsapp {
      display: inline-block;
      background: #d4af37;
      color: #080808;
      text-decoration: none;
      padding: 16px 30px;
      border-radius: 35px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(212,175,55,0.3);
      transition: 0.3s;
    }

    .whatsapp:hover {
      transform: scale(1.05);
    }

    .location {
      margin-top: 30px;
      color: #aaa;
      line-height: 1.8;
    }

    footer {
      margin-top: 45px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="logo">JO MACODE</div>

    <div class="tagline">
      STYLE • QUALITY • CONFIDENCE
    </div>

    <p class="welcome">
      Karibu JO Macode Store — sehemu yako ya kupata fashion
      yenye style, quality na muonekano wa kipekee.
    </p>

    <div class="categories">
      <div class="category">T-Shirts</div>
      <div class="category">Jeans</div>
      <div class="category">Magauni</div>
      <div class="category">Fashion</div>
    </div>

    <a class="whatsapp"
       href="https://wa.me/255686281609"
       target="_blank">
      ORDER VIA WHATSAPP
    </a>

    <div class="location">
      📍 Kilimahewa, Mwanza<br>
      📞 0686 281 609
    </div>

    <footer>
      © 2026 JO Macode Store. All Rights Reserved.
    </footer>

  </section>

</body>
</html>
